<html>
<head>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div class="container">
        <h1>Snoopy Blackjack</h1>

        <p id="message-el">Want to play a round?</p>

        <div id="dealer-board">
            <h2>Snoopy's Cards</h2>
            <p id="dealer-cards"></p>
            <div id="dealer_card_imgs"></div>
            <p id="dealer-sum-el">Sum:</p>
        </div>

        <div id="your-board">
            <h2>Your Cards</h2>
            <p id="cards-el"></p>
            <div id="card_imgs"></div>
            <p id="sum-el">Sum:</p>
        </div>
        
        <button id="start-btn">START GAME</button>
        <button id="newcard-btn">NEW CARD</button>
        <button id="hit-btn">HIT</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
